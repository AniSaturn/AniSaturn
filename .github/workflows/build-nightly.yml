name: Build Nightly

on:
  workflow_dispatch:
    inputs:
      version_short:
        description: 'Version'
        required: true
        default: 'v.nightly'
        type: string
      version_build:
        description: 'Build number'
        required: true
        default: '1'
        type: string
        

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Commit
        id: version
        run: |
          COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          
          VERSION="${{ github.event.inputs.version_short }}_($COMMIT_HASH)"
          
          echo "final_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Install CMake
        run: brew install cmake

      - name: Configure with CMake
        run: |
          cmake -G Xcode \
          -B build \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_CXX_STANDARD=17 \
          -DVER_SHORT="${{ steps.version.outputs.final_version }}" \
          -DVER_BUILD="${{ github.event.inputs.version_build }}" \
          -DBUNDLE_ID="delta.cion.anisaturnbeta"

      - name: Build .app
        run: |
          xcodebuild -project build/AniSaturn.xcodeproj \
            -scheme AniSaturn \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="delta.cion.anisaturnbeta"

      - name: Locate .app
        id: locate
        run: |
          APP_PATH=$(find build/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.locate.outputs.app_path }}" Payload/
          zip -r AniSaturn.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AniSaturn.ipa
          path: AniSaturn.ipa
          retention-days: 7
      
      -   name: Build metadata
          id: metadata
          run: |
            echo "timestamp=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
            echo "hash=$(git rev-parse --short=16 HEAD)" >> "$GITHUB_OUTPUT"

      -   name: Upload nightly release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: nightly
            name: "Nightly build"
            body: |
              Unstable build of Hysteria.
              ```txt
              ${{ steps.metadata.outputs.timestamp }}
              ```
              ```txt
              ${{ steps.metadata.outputs.hash }}
              ```
            files: AniSaturn.ipa
            allow_updates: true
            prerelease: true
            token: ${{ secrets.GITHUB_TOKEN }}